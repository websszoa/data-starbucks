name: Daily Starbucks Collection

on:
  schedule:
    # 매일 한국 시간 오전 7시 (UTC 전날 22시)
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: daily-starbucks-collection
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 체크아웃
      - uses: actions/checkout@v4

      # 2. Python 설정
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      # 3. 위치 변경 감지 후 필요한 지역만 상세 정보 수집
      - name: Run Daily Starbucks Collection
        run: |
          python starbucks-daily.py

      # 3-1. stores.json(직접 관리)과 비교해 신규·폐점 매장 기록
      - name: Check Store Changes
        run: |
          python starbucks-changes.py

      # 3-2. 할리스 매장 수집 (실패해도 스타벅스 데이터 커밋은 진행)
      - name: Run Daily Hollys Collection
        continue-on-error: true
        run: |
          python hollys-daily.py

      # 4. 생성된 데이터 파일 커밋
      - name: Commit changes
        run: |
          git config --global user.email "webstoryboy@naver.com"
          git config --global user.name "websseu"
          git add starbucks/ hollys/
          git commit -m "스타벅스 데이터 업데이트 - $(date +"%Y-%m-%d")" || echo "No changes to commit"

      # 5. 변경사항 푸시
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          branch: "main"
          github_token: ${{ secrets.GITHUB_TOKEN }}
